[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crbench"
version = "0.2.0"
description = "CRBench: Context Resource Benchmark for Long-Context LLMs"
readme = "README.md"
authors = [{ name = "CRBench Authors" }]
license = "MIT"
keywords = ["llm", "long-context", "kv-cache", "benchmark", "quantization", "efficiency"]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "tabulate>=0.9.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
crbench = "crbench.cli:main"

[tool.setuptools.packages.find]
include = ["crbench*"]
