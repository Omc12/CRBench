# CRBench -- Gemma 4 E4B (NF4) with per-task generation budgets.
# Evaluated up to 32768 context (64K spills into WDDM host memory on 12GB).

benchmark_name: "crbench_gemma4_e4b_budget"

model:
  model_name_or_path: "google/gemma-4-e4b-it"
  dtype: "bfloat16"
  device: "auto"
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  attn_implementation: "sdpa"
  max_model_len: 131072

tasks:
  - task_name: "single_niah"
    context_lengths: [2048, 4096, 8192, 16384, 32768]
    num_samples: 3
    seed: 42
    max_new_tokens: 32

  - task_name: "multi_niah"
    context_lengths: [2048, 4096, 8192, 16384, 32768]
    num_samples: 3
    seed: 42
    max_new_tokens: 96

  - task_name: "ruler_kv"
    context_lengths: [2048, 4096, 8192, 16384, 32768]
    num_samples: 3
    seed: 42
    max_new_tokens: 32

  - task_name: "ruler_variable_tracking"
    context_lengths: [2048, 4096, 8192, 16384, 32768]
    num_samples: 3
    seed: 42
    max_new_tokens: 256

  - task_name: "multihop_qa"
    context_lengths: [2048, 4096, 8192, 16384, 32768]
    num_samples: 3
    seed: 42
    max_new_tokens: 128

adapters:
  - adapter_name: "dense_fp16"
    adapter_type: "dense"
    budgets: [16.0]

  - adapter_name: "kivi_style_kv_quant"
    adapter_type: "quantized"
    budgets: [4.0, 8.0]
    params: {group_size: 64}

  - adapter_name: "snapkv"
    adapter_type: "eviction"
    budgets: [4.0, 8.0]
    params: {strategy: "snapkv", window_size: 32, kernel_size: 5, pooling: "avgpool"}

  - adapter_name: "streaming_llm"
    adapter_type: "eviction"
    budgets: [4.0, 8.0]
    params: {strategy: "streaming_llm", sink_tokens: 4}

  - adapter_name: "kv_merging"
    adapter_type: "merging"
    budgets: [4.0, 8.0]
    params: {sink_tokens: 4, recent_window: 32}

  - adapter_name: "low_rank_kv"
    adapter_type: "compressed"
    budgets: [4.0, 8.0]
    params: {recent_window: 32}

  - adapter_name: "dkv_mid"
    adapter_type: "dkv"
    budgets: [16.0]
    params: {preset: "mid"}

  - adapter_name: "dkv_high"
    adapter_type: "dkv"
    budgets: [16.0]
    params: {preset: "high"}

profiler:
  track_physical_memory: true
  track_latency: true
  prefill_chunk_size: 2048
  max_new_tokens: 32
  empty_cache_between_chunks: true

scoring:
  utility_formula: "linear"
  utility_alpha: 0.70
  enable_part2: true
  standard_budgets_bpt: [2.0, 4.0, 8.0, 16.0]
  auqc_log_scale: true
  context_weighting: "logarithmic"
  min_dynamic_range: 0.05
  floor_quality: 0.0

output_dir: "benchmarks/bench_gemma4_e4b_budget"
save_plots: true
save_raw_json: true
