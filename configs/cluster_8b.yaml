# CRBench 8B Cluster Benchmark Configuration
# For high-memory NVIDIA GPU servers (A100 / H100 / RTX 4090).

benchmark_name: "crbench_8b_cluster"

model:
  model_name_or_path: "meta-llama/Meta-Llama-3.1-8B-Instruct"
  dtype: "bfloat16"
  device: "auto"
  trust_remote_code: true

tasks:
  - task_name: "single_niah"
    context_lengths: [8192, 16384, 32768]
    num_samples: 10
    seed: 42

  - task_name: "multi_niah"
    context_lengths: [8192, 16384, 32768]
    num_samples: 10
    seed: 42

  - task_name: "ruler_kv"
    context_lengths: [8192, 16384, 32768]
    num_samples: 10
    seed: 42

  - task_name: "ruler_variable_tracking"
    context_lengths: [8192, 16384, 32768]
    num_samples: 10
    seed: 42

  - task_name: "multihop_qa"
    context_lengths: [8192, 16384, 32768]
    num_samples: 10
    seed: 42

adapters:
  - adapter_name: "dense_fp16"
    adapter_type: "dense"
    budgets: [16.0]

  - adapter_name: "kv_quant_int8"
    adapter_type: "quantized"
    budgets: [8.0]
    params:
      bits: 8

  - adapter_name: "kv_quant_int4"
    adapter_type: "quantized"
    budgets: [4.0]
    params:
      bits: 4

  - adapter_name: "kv_quant_int2"
    adapter_type: "quantized"
    budgets: [2.0]
    params:
      bits: 2

  - adapter_name: "snapkv"
    adapter_type: "eviction"
    budgets: [2.0, 4.0, 8.0]
    params:
      strategy: "snapkv"

  - adapter_name: "streaming_llm"
    adapter_type: "eviction"
    budgets: [2.0, 4.0, 8.0]
    params:
      strategy: "streaming_llm"

  - adapter_name: "kv_merging"
    adapter_type: "merging"
    budgets: [4.0, 8.0]

  - adapter_name: "low_rank_kv"
    adapter_type: "compressed"
    budgets: [4.0, 8.0]

  - adapter_name: "custom_dkv"
    adapter_type: "custom"
    budgets: [2.0, 4.0, 8.0]

profiler:
  track_physical_memory: true
  track_latency: true

scoring:
  utility_formula: "linear"
  utility_alpha: 0.70
  enable_part2: true
  standard_budgets_bpt: [2.0, 4.0, 8.0, 16.0]
  auqc_log_scale: true
  context_weighting: "logarithmic"
  min_dynamic_range: 0.05
  floor_quality: 0.0

output_dir: "results/8b_cluster_benchmark"
save_plots: true
save_raw_json: true
