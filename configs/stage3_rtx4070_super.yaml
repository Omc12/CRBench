benchmark_name: "crbench_rtx4070_super"

# Tailored for 12GB RTX 4070 Super:
# Qwen2.5-3B-Instruct uses ~6.0GB for BF16 weights, leaving 6.0GB for deep KV cache sweeps (up to 32K-64K context).
model:
  model_name_or_path: "Qwen/Qwen2.5-3B-Instruct"  # Alternative: "meta-llama/Llama-3.2-3B-Instruct" or "Qwen/Qwen2.5-1.5B-Instruct"
  dtype: "bfloat16"
  device: "cuda"
  attn_implementation: "sdpa"  # Built-in PyTorch 2.x fast attention (or "flash_attention_2" if installed)
  trust_remote_code: true

tasks:
  - task_name: "single_niah"
    context_lengths: [4096, 8192, 16384, 32768]
    num_samples: 5
    seed: 42

  - task_name: "multi_niah"
    context_lengths: [4096, 8192, 16384, 32768]
    num_samples: 5
    seed: 42

  - task_name: "ruler_kv"
    context_lengths: [4096, 8192, 16384, 32768]
    num_samples: 5
    seed: 42

  - task_name: "ruler_variable_tracking"
    context_lengths: [4096, 8192, 16384, 32768]
    num_samples: 5
    seed: 42

  - task_name: "multihop_qa"
    context_lengths: [4096, 8192, 16384, 32768]
    num_samples: 5
    seed: 42

adapters:
  - adapter_name: "dense_fp16"
    adapter_type: "dense"
    budgets: [16.0]

  - adapter_name: "kv_quant_fp8"
    adapter_type: "quantized"
    budgets: [8.0]
    params:
      bits: 8

  - adapter_name: "kv_quant_int8"
    adapter_type: "quantized"
    budgets: [8.0]
    params:
      bits: 8

  - adapter_name: "kv_quant_int4"
    adapter_type: "quantized"
    budgets: [4.0]
    params:
      bits: 4

  - adapter_name: "kv_quant_int2"
    adapter_type: "quantized"
    budgets: [2.0]
    params:
      bits: 2

  - adapter_name: "snapkv"
    adapter_type: "eviction"
    budgets: [2.0, 4.0, 8.0]
    params:
      strategy: "snapkv"

  - adapter_name: "streaming_llm"
    adapter_type: "eviction"
    budgets: [2.0, 4.0, 8.0]
    params:
      strategy: "streaming_llm"

  - adapter_name: "h2o"
    adapter_type: "eviction"
    budgets: [2.0, 4.0, 8.0]
    params:
      strategy: "h2o"

  - adapter_name: "kv_merging"
    adapter_type: "merging"
    budgets: [2.0, 4.0, 8.0]

  - adapter_name: "low_rank_kv"
    adapter_type: "compressed"
    budgets: [2.0, 4.0, 8.0]

  - adapter_name: "custom_dkv"
    adapter_type: "custom"
    budgets: [2.0, 4.0, 8.0]

profiler:
  track_physical_memory: true
  track_latency: true
  warmup_steps: 2
  device_synchronize: true

scoring:
  standard_budgets_bpt: [2.0, 4.0, 8.0, 16.0]
  standard_budgets_gb: [0.5, 1.0, 2.0, 4.0]
  auqc_log_scale: true
  context_weighting: "logarithmic"
  min_dynamic_range: 0.05
  floor_quality: 0.0
  bootstrap_samples: 1000
  ci_level: 0.95

output_dir: "results/rtx4070_super"
save_plots: true
save_raw_json: true
