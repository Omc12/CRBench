benchmark_name: "crbench_qwen15b_formula_validation"

model:
  model_name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"
  dtype: "bfloat16"
  device: "auto"
  trust_remote_code: true

# Focused task set: 2 tasks × 2 context lengths = 4 task-length combos
# This gives us meaningful Q discrimination without OOM on 8GB Mac
tasks:
  - task_name: "single_niah"
    context_lengths: [2048, 4096]
    num_samples: 3
    seed: 42

  - task_name: "multi_niah"
    context_lengths: [2048, 4096]
    num_samples: 3
    seed: 42

  - task_name: "ruler_kv"
    context_lengths: [2048, 4096]
    num_samples: 3
    seed: 42

adapters:
  # Dense baseline (normalization reference)
  - adapter_name: "dense_fp16"
    adapter_type: "dense"
    budgets: [16.0]

  # KV quantization: bit-width sweep for formula test
  - adapter_name: "kv_quant_int8"
    adapter_type: "quantized"
    budgets: [8.0]
    params:
      bits: 8

  - adapter_name: "kv_quant_int4"
    adapter_type: "quantized"
    budgets: [4.0]
    params:
      bits: 4

  - adapter_name: "kv_quant_int2"
    adapter_type: "quantized"
    budgets: [2.0]
    params:
      bits: 2

  # Eviction: SnapKV (token selection)
  - adapter_name: "snapkv"
    adapter_type: "eviction"
    budgets: [4.0, 8.0]
    params:
      strategy: "snapkv"

  # Eviction: StreamingLLM (window-based)
  - adapter_name: "streaming_llm"
    adapter_type: "eviction"
    budgets: [4.0, 8.0]
    params:
      strategy: "streaming_llm"

  # Low-rank projection
  - adapter_name: "low_rank_kv"
    adapter_type: "compressed"
    budgets: [4.0, 8.0]

profiler:
  track_physical_memory: true
  track_latency: true

scoring:
  standard_budgets_bpt: [2.0, 4.0, 8.0, 16.0]
  auqc_log_scale: true
  context_weighting: "logarithmic"
  min_dynamic_range: 0.05
  floor_quality: 0.0

output_dir: "results/qwen15b_formula_validation"
save_plots: true
save_raw_json: true
