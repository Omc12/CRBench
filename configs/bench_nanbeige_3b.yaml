# CRBench -- Nanbeige4.2-3B (NF4), uniform full attention.
#
# Chosen for the heaviest KV cache of any model surveyed, because that is what
# makes compression measurable: at 176 KiB/token every one of its cache layers
# is subject to the methods under test, unlike hybrid architectures where only a
# minority of layers hold a cache that grows with context.
#
#   Nanbeige4.2-3B   176 KiB/tok   44/44 cache layers growing
#   Qwen2.5-7B        56 KiB/tok   28/28
#   Qwen3.5-4B        32 KiB/tok    8/32
#   Gemma 4 E4B       28 KiB/tok    7/42
#
# That 176 KiB is measured, not read from the config. The model sets
# num_loops = 2 with loop_share_kv = False, so its 22 decoder layers run twice
# and occupy 44 distinct cache slots; num_hidden_layers understates the cache by
# exactly half.
#
# The same property caps the range. Measured on an RTX 4070 SUPER (11.99 GiB)
# with NF4 weights resident at 3.42 GiB:
#
#   tokens     KV    peak  transient  headroom   decode
#     8192   1.36    5.51       0.73      6.48    63 ms/tok
#    16384   2.73    6.92       0.77      5.07   109 ms/tok
#    24576   4.11    8.49       0.97      3.50   153 ms/tok
#    32768   5.48   10.06       1.16      1.93   851 ms/tok
#
# The decode column is what sets the limit, not peak allocation. It scales
# cleanly with cache size to 24576 and then jumps 5.6x for a 1.33x larger cache:
# peak *allocated* still reads 10.06 GiB, but allocator reserve on top of it
# exceeds what the card has left and the run pages to host memory. Latency
# measured in that state describes PCIe, not the method.
#
# The transient is larger here than for most models because this one's forward
# predates `logits_to_keep`, so every prefill chunk materialises the full
# (chunk x 166144) logit tensor. Hence the small chunk.
#
# So the grid stops at 24576. Reaching 128K on this card requires a model with a
# far lighter cache, which is what the Gemma 4 E4B config is for; the two
# together cover 2K-128K. The model's own window is 262144, so nothing here is
# limited by position range and no RoPE scaling is applied.

benchmark_name: "crbench_nanbeige_3b"

model:
  model_name_or_path: "Nanbeige/Nanbeige4.2-3B"
  dtype: "bfloat16"
  device: "auto"
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  attn_implementation: "sdpa"
  max_model_len: 32768
  # Its vendored modeling predates transformers 5 and reads
  # `config.rope_scaling["type"]`, a key now called `rope_type`, so it raises
  # KeyError on a model that applies no scaling at all. Setting this to null
  # selects its unscaled branch, which is what its own config asks for.
  config_overrides:
    rope_scaling: null

tasks:
  - task_name: "single_niah"
    context_lengths: [2048, 4096, 8192, 16384, 24576]
    num_samples: 3
    seed: 42
  - task_name: "multi_niah"
    context_lengths: [2048, 4096, 8192, 16384, 24576]
    num_samples: 3
    seed: 42
  - task_name: "ruler_kv"
    context_lengths: [2048, 4096, 8192, 16384, 24576]
    num_samples: 3
    seed: 42
  - task_name: "ruler_variable_tracking"
    context_lengths: [2048, 4096, 8192, 16384, 24576]
    num_samples: 3
    seed: 42
  - task_name: "multihop_qa"
    context_lengths: [2048, 4096, 8192, 16384, 24576]
    num_samples: 3
    seed: 42

adapters:
  - adapter_name: "dense_fp16"
    adapter_type: "dense"
    budgets: [16.0]

  - adapter_name: "kv_quant"
    adapter_type: "quantized"
    budgets: [4.0, 8.0]
    params: {group_size: 64}

  - adapter_name: "snapkv"
    adapter_type: "eviction"
    budgets: [4.0, 8.0]
    params: {strategy: "snapkv", window_size: 32, kernel_size: 5, pooling: "avgpool"}

  - adapter_name: "streaming_llm"
    adapter_type: "eviction"
    budgets: [4.0, 8.0]
    params: {strategy: "streaming_llm", sink_tokens: 4}

  - adapter_name: "kv_merging"
    adapter_type: "merging"
    budgets: [4.0, 8.0]
    params: {sink_tokens: 4, recent_window: 32}

  - adapter_name: "low_rank_kv"
    adapter_type: "compressed"
    budgets: [4.0, 8.0]
    params: {recent_window: 32}

  - adapter_name: "dkv_mid"
    adapter_type: "dkv"
    budgets: [16.0]
    params: {preset: "mid"}

  - adapter_name: "dkv_high"
    adapter_type: "dkv"
    budgets: [16.0]
    params: {preset: "high"}

profiler:
  track_physical_memory: true
  track_latency: true
  # Its forward predates `logits_to_keep`, so every prefill chunk materialises
  # (chunk x 166144) logits. At 2048 that is 0.63 GiB of pure transient on top
  # of a cache that is already the heaviest here, so the chunk is kept small.
  prefill_chunk_size: 512
  max_new_tokens: 32
  empty_cache_between_chunks: true

scoring:
  utility_formula: "linear"
  utility_alpha: 0.70
  enable_part2: true
  standard_budgets_bpt: [2.0, 4.0, 8.0, 16.0]
  auqc_log_scale: true
  context_weighting: "logarithmic"
  min_dynamic_range: 0.05
  floor_quality: 0.0

output_dir: "results/bench_nanbeige_3b"
save_plots: true
save_raw_json: true
