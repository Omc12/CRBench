# CRBench -- Gemma 4 E4B (NF4).
#
# Its window is natively 131072, but this card cannot use it. Measured, prefill
# chunk 2048, NF4 weights resident at 8.67 GiB leaving 1.64 GiB free:
#
#   tokens     KV    peak  transient  headroom   decode
#     8192   0.14    9.25       0.44      2.75    74 ms/tok
#    32768   0.52   10.21       1.02      1.79    81 ms/tok
#    65536   1.02   11.50       1.82      0.50   402 ms/tok
#
# The limit here is the weights, not the cache: at 65536 the KV is only 1.02 GiB
# but the model itself takes 8.67, and the run pages. Decode goes 74 -> 81 ->
# 402 ms/token, and the last figure describes PCIe rather than the method.
#
# The opposite failure to Nanbeige4.2, which had a 3.42 GiB model and a cache so
# heavy it ran out at 24576. Only 7 of this model's layers hold a cache that
# grows with context; the other 35 are sliding-window capped at 512 tokens, so
# compression can act on a minority of the footprint. Gemma 4 E2B carries the
# 64K/128K end of the sweep.

benchmark_name: "crbench_gemma4_e4b_dkv"

model:
  model_name_or_path: "google/gemma-4-e4b-it"
  dtype: "bfloat16"
  device: "auto"
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  attn_implementation: "sdpa"
  max_model_len: 131072

tasks:
  - task_name: "single_niah"
    context_lengths: [2048, 4096, 8192, 16384, 32768]
    num_samples: 3
    seed: 42
  - task_name: "multi_niah"
    context_lengths: [2048, 4096, 8192, 16384, 32768]
    num_samples: 3
    seed: 42
  - task_name: "ruler_kv"
    context_lengths: [2048, 4096, 8192, 16384, 32768]
    num_samples: 3
    seed: 42
  - task_name: "ruler_variable_tracking"
    context_lengths: [2048, 4096, 8192, 16384, 32768]
    num_samples: 3
    seed: 42
  - task_name: "multihop_qa"
    context_lengths: [2048, 4096, 8192, 16384, 32768]
    num_samples: 3
    seed: 42

adapters:
  # Dense is the scoring anchor; the other six methods already have valid
  # measurements in results/bench_gemma4_e4b. Only DKV is (re)run here, against
  # the refreshed upstream.
  - adapter_name: "dense_fp16"
    adapter_type: "dense"
    budgets: [16.0]

  - adapter_name: "dkv_mid"
    adapter_type: "dkv"
    budgets: [16.0]
    params: {preset: "mid"}

  - adapter_name: "dkv_high"
    adapter_type: "dkv"
    budgets: [16.0]
    params: {preset: "high"}

profiler:
  track_physical_memory: true
  track_latency: true
  # Its forward predates `logits_to_keep`, so every prefill chunk materialises
  # (chunk x 166144) logits. At 2048 that is 0.63 GiB of pure transient on top
  # of a cache that is already the heaviest here, so the chunk is kept small.
  prefill_chunk_size: 2048
  max_new_tokens: 32
  empty_cache_between_chunks: true

scoring:
  utility_formula: "linear"
  utility_alpha: 0.70
  enable_part2: true
  standard_budgets_bpt: [2.0, 4.0, 8.0, 16.0]
  auqc_log_scale: true
  context_weighting: "logarithmic"
  min_dynamic_range: 0.05
  floor_quality: 0.0

output_dir: "results/bench_gemma4_e4b_dkv"
save_plots: true
save_raw_json: true
