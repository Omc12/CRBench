# CRBench pipeline smoke test.
# Exercises every adapter, the real dense baseline, the measured latency/VRAM
# path and the provenance manifest on a small model, so that a failure in the
# long benchmark runs is a hardware result rather than a code defect.

benchmark_name: "crbench_smoke"

model:
  model_name_or_path: "Qwen/Qwen2.5-0.5B-Instruct"
  dtype: "bfloat16"
  device: "auto"
  trust_remote_code: true
  attn_implementation: "sdpa"
  max_model_len: 8192

tasks:
  - task_name: "single_niah"
    context_lengths: [2048, 4096]
    num_samples: 2
    seed: 42

  - task_name: "ruler_kv"
    context_lengths: [2048, 4096]
    num_samples: 2
    seed: 42

adapters:
  - adapter_name: "dense_fp16"
    adapter_type: "dense"
    budgets: [16.0]

  - adapter_name: "kv_quant_int8"
    adapter_type: "quantized"
    budgets: [8.0]
    params: {bits: 8}

  - adapter_name: "kv_quant_int4"
    adapter_type: "quantized"
    budgets: [4.0]
    params: {bits: 4}

  - adapter_name: "kv_quant_int2"
    adapter_type: "quantized"
    budgets: [2.0]
    params: {bits: 2}

  - adapter_name: "snapkv"
    adapter_type: "eviction"
    budgets: [4.0]
    params: {strategy: "snapkv", window_size: 32, kernel_size: 5, pooling: "avgpool"}

  - adapter_name: "streaming_llm"
    adapter_type: "eviction"
    budgets: [4.0]
    params: {strategy: "streaming_llm", sink_tokens: 4}

  - adapter_name: "kv_merging"
    adapter_type: "merging"
    budgets: [4.0]

  - adapter_name: "low_rank_kv"
    adapter_type: "compressed"
    budgets: [4.0]

  - adapter_name: "dkv"
    adapter_type: "dkv"
    budgets: [4.0]
    params: {block_size: 256, residual_budget: 128, recent_window: 256}

profiler:
  track_physical_memory: true
  track_latency: true
  prefill_chunk_size: 2048
  max_new_tokens: 32

scoring:
  utility_formula: "linear"
  utility_alpha: 0.70
  enable_part2: true
  standard_budgets_bpt: [2.0, 4.0, 8.0, 16.0]
  auqc_log_scale: true
  context_weighting: "logarithmic"
  min_dynamic_range: 0.05
  floor_quality: 0.0

output_dir: "results/smoke_test"
save_plots: false
save_raw_json: true
