# CRBench Standard Benchmark Configuration
# Evaluates all primary KV compression paradigms across context lengths and tasks.

benchmark_name: "crbench_standard"

model:
  model_name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"
  dtype: "bfloat16"
  device: "auto"
  trust_remote_code: true

tasks:
  - task_name: "single_niah"
    context_lengths: [2048, 4096, 8192]
    num_samples: 5
    seed: 42

  - task_name: "multi_niah"
    context_lengths: [2048, 4096, 8192]
    num_samples: 5
    seed: 42

  - task_name: "ruler_kv"
    context_lengths: [2048, 4096, 8192]
    num_samples: 5
    seed: 42

  - task_name: "ruler_variable_tracking"
    context_lengths: [2048, 4096, 8192]
    num_samples: 5
    seed: 42

  - task_name: "multihop_qa"
    context_lengths: [2048, 4096, 8192]
    num_samples: 5
    seed: 42

adapters:
  # 1. Uncompressed Reference Baseline
  - adapter_name: "dense_fp16"
    adapter_type: "dense"
    budgets: [16.0]

  # 2. KV Quantization (INT8, INT4, INT2)
  - adapter_name: "kv_quant_int8"
    adapter_type: "quantized"
    budgets: [8.0]
    params:
      bits: 8

  - adapter_name: "kv_quant_int4"
    adapter_type: "quantized"
    budgets: [4.0]
    params:
      bits: 4

  - adapter_name: "kv_quant_int2"
    adapter_type: "quantized"
    budgets: [2.0]
    params:
      bits: 2

  # 3. KV Eviction (SnapKV, StreamingLLM)
  - adapter_name: "snapkv"
    adapter_type: "eviction"
    budgets: [2.0, 4.0, 8.0]
    params:
      strategy: "snapkv"

  - adapter_name: "streaming_llm"
    adapter_type: "eviction"
    budgets: [2.0, 4.0, 8.0]
    params:
      strategy: "streaming_llm"

  # 4. KV Merging
  - adapter_name: "kv_merging"
    adapter_type: "merging"
    budgets: [4.0, 8.0]

  # 5. Low-Rank Spectral Compression
  - adapter_name: "low_rank_kv"
    adapter_type: "compressed"
    budgets: [4.0, 8.0]

  # 6. Disentangled Subspace (DKV Example)
  - adapter_name: "custom_dkv"
    adapter_type: "custom"
    budgets: [2.0, 4.0, 8.0]

profiler:
  track_physical_memory: true
  track_latency: true

scoring:
  utility_formula: "linear"
  utility_alpha: 0.70
  enable_part2: true
  standard_budgets_bpt: [2.0, 4.0, 8.0, 16.0]
  auqc_log_scale: true
  context_weighting: "logarithmic"
  min_dynamic_range: 0.05
  floor_quality: 0.0

output_dir: "results/standard_benchmark"
save_plots: true
save_raw_json: true
