# CRBench -- Qwen2.5-3B-Instruct (NF4), native context window.
#
# The 2K-32K half of the 3B sweep. Kept on the same grid as the 7B config so the
# two models are directly comparable where they overlap, and split from the
# 64K/128K run because those lengths need YaRN and this one must not have it:
# Qwen2.5-3B's native max_position_embeddings is 32768, and mixing scaled and
# unscaled positions inside one sweep would make the curve discontinuous for a
# reason that has nothing to do with KV compression.
#
# Measured on this card: NF4 weights 1.92 GiB, KV 36 KiB/token, peak 4.58 GiB at
# 32768 tokens -- comfortable, unlike the 7B at the same length.

benchmark_name: "crbench_3b_native"

model:
  model_name_or_path: "Qwen/Qwen2.5-3B-Instruct"
  dtype: "bfloat16"
  device: "auto"
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  attn_implementation: "sdpa"
  max_model_len: 32768
  rope_scaling: null   # native window only

tasks:
  - task_name: "single_niah"
    context_lengths: [2048, 4096, 8192, 16384, 32768]
    num_samples: 3
    seed: 42
  - task_name: "multi_niah"
    context_lengths: [2048, 4096, 8192, 16384, 32768]
    num_samples: 3
    seed: 42
  - task_name: "ruler_kv"
    context_lengths: [2048, 4096, 8192, 16384, 32768]
    num_samples: 3
    seed: 42
  - task_name: "ruler_variable_tracking"
    context_lengths: [2048, 4096, 8192, 16384, 32768]
    num_samples: 3
    seed: 42
  - task_name: "multihop_qa"
    context_lengths: [2048, 4096, 8192, 16384, 32768]
    num_samples: 3
    seed: 42

# One adapter per method family, swept over two budgets, so Part 1's AUQC
# integrates a real quality-vs-budget curve instead of extrapolating a point.
adapters:
  - adapter_name: "dense_fp16"
    adapter_type: "dense"
    budgets: [16.0]

  - adapter_name: "kv_quant"
    adapter_type: "quantized"
    budgets: [4.0, 8.0]
    params: {group_size: 64}

  - adapter_name: "snapkv"
    adapter_type: "eviction"
    budgets: [4.0, 8.0]
    params: {strategy: "snapkv", window_size: 32, kernel_size: 5, pooling: "avgpool"}

  - adapter_name: "streaming_llm"
    adapter_type: "eviction"
    budgets: [4.0, 8.0]
    params: {strategy: "streaming_llm", sink_tokens: 4}

  - adapter_name: "kv_merging"
    adapter_type: "merging"
    budgets: [4.0, 8.0]
    params: {sink_tokens: 4, recent_window: 32}

  - adapter_name: "low_rank_kv"
    adapter_type: "compressed"
    budgets: [4.0, 8.0]
    params: {recent_window: 32}

  # DKV is preset-driven, not budget-driven. Its knobs interact -- the spectral
  # energy target sets the realised rank (the rank field is only a ceiling), an
  # exact residual token costs as much as an uncompressed one, and the dense
  # recency window has its own precision -- so solving them for a bits-per-token
  # target would invent a configuration its authors never characterised. The
  # repository's own `mid` and `high` presets are used verbatim, and CRBench
  # reports the b_eff each one actually produces.
  - adapter_name: "dkv_mid"
    adapter_type: "dkv"
    budgets: [16.0]
    params: {preset: "mid"}

  - adapter_name: "dkv_high"
    adapter_type: "dkv"
    budgets: [16.0]
    params: {preset: "high"}

profiler:
  track_physical_memory: true
  track_latency: true
  prefill_chunk_size: 4096
  max_new_tokens: 32
  empty_cache_between_chunks: true

scoring:
  utility_formula: "linear"
  utility_alpha: 0.70
  enable_part2: true
  standard_budgets_bpt: [2.0, 4.0, 8.0, 16.0]
  auqc_log_scale: true
  context_weighting: "logarithmic"
  min_dynamic_range: 0.05
  floor_quality: 0.0

output_dir: "results/bench_3b_native"
save_plots: true
save_raw_json: true
