# CRBench -- Gemma 4 E2B (NF4). The only configuration here that reaches 128K.
#
# Measured on an RTX 4070 SUPER (11.99 GiB), prefill chunk 2048, NF4 weights
# resident at 6.28 GiB:
#
#   tokens     KV    peak  transient  headroom   decode
#     8192   0.05    6.62       0.29      5.37    56 ms/tok
#    32768   0.19    6.92       0.44      5.08    63 ms/tok
#    65536   0.38    7.40       0.74      4.59    69 ms/tok
#    98304   0.57    7.88       1.03      4.11    89 ms/tok
#   131072   0.76    8.36       1.33      3.63   109 ms/tok
#
# Decode scales cleanly the whole way with no spill knee, unlike Nanbeige4.2
# (851 ms/token at 32768) or Gemma 4 E4B (402 at 65536).
#
# The caveat this model carries: only 4 of its 24 cache layers grow with
# context, the other 20 being sliding-window layers pinned at 511 tokens. Its KV
# is therefore 16 KiB/token and just 0.76 GiB at 131072 -- which is exactly why
# it fits, and equally why compression has less to act on here than on a
# uniform-attention model. Read alongside the Qwen2.5-7B results, where every
# layer's cache grows and the same methods work against 56 KiB/token.

benchmark_name: "crbench_gemma4_e2b"

model:
  model_name_or_path: "google/gemma-4-e2b-it"
  dtype: "bfloat16"
  device: "auto"
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  attn_implementation: "sdpa"
  max_model_len: 131072

tasks:
  - task_name: "single_niah"
    context_lengths: [2048, 8192, 32768, 65536, 131072]
    num_samples: 3
    seed: 42
  - task_name: "multi_niah"
    context_lengths: [2048, 8192, 32768, 65536, 131072]
    num_samples: 3
    seed: 42
  - task_name: "ruler_kv"
    context_lengths: [2048, 8192, 32768, 65536, 131072]
    num_samples: 3
    seed: 42
  - task_name: "ruler_variable_tracking"
    context_lengths: [2048, 8192, 32768, 65536, 131072]
    num_samples: 3
    seed: 42
  - task_name: "multihop_qa"
    context_lengths: [2048, 8192, 32768, 65536, 131072]
    num_samples: 3
    seed: 42

adapters:
  - adapter_name: "dense_fp16"
    adapter_type: "dense"
    budgets: [16.0]

  - adapter_name: "kv_quant"
    adapter_type: "quantized"
    budgets: [4.0, 8.0]
    params: {group_size: 64}

  - adapter_name: "snapkv"
    adapter_type: "eviction"
    budgets: [4.0, 8.0]
    params: {strategy: "snapkv", window_size: 32, kernel_size: 5, pooling: "avgpool"}

  - adapter_name: "streaming_llm"
    adapter_type: "eviction"
    budgets: [4.0, 8.0]
    params: {strategy: "streaming_llm", sink_tokens: 4}

  - adapter_name: "kv_merging"
    adapter_type: "merging"
    budgets: [4.0, 8.0]
    params: {sink_tokens: 4, recent_window: 32}

  - adapter_name: "low_rank_kv"
    adapter_type: "compressed"
    budgets: [4.0, 8.0]
    params: {recent_window: 32}

  - adapter_name: "dkv_mid"
    adapter_type: "dkv"
    budgets: [16.0]
    params: {preset: "mid"}

  - adapter_name: "dkv_high"
    adapter_type: "dkv"
    budgets: [16.0]
    params: {preset: "high"}

profiler:
  track_physical_memory: true
  track_latency: true
  # Its forward predates `logits_to_keep`, so every prefill chunk materialises
  # (chunk x 166144) logits. At 2048 that is 0.63 GiB of pure transient on top
  # of a cache that is already the heaviest here, so the chunk is kept small.
  prefill_chunk_size: 2048
  max_new_tokens: 32
  empty_cache_between_chunks: true

scoring:
  utility_formula: "linear"
  utility_alpha: 0.70
  enable_part2: true
  standard_budgets_bpt: [2.0, 4.0, 8.0, 16.0]
  auqc_log_scale: true
  context_weighting: "logarithmic"
  min_dynamic_range: 0.05
  floor_quality: 0.0

output_dir: "results/bench_gemma4_e2b"
save_plots: true
save_raw_json: true
